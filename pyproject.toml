[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "pygitmirror"
dynamic = ["version"]
description = "Clone, sync and migrate git repositories between GitHub, GitLab, Gitea and Bitbucket"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bassem Girgis", email = "brgirgis@gmail.com" }]
maintainers = [{ name = "Bassem Girgis", email = "brgirgis@gmail.com" }]
keywords = [
  "git",
  "mirror",
  "clone",
  "sync",
  "migrate",
  "github",
  "gitlab",
  "gitea",
  "bitbucket",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Archiving :: Mirroring",
  "Typing :: Typed",
]
# No dependencies: the package runs the git executable and uses the standard
# library for everything else. See docs/project/decisions.rst.
dependencies = []


[project.urls]
Homepage = "https://github.com/pygitmirror/pygitmirror"
Documentation = "https://pygitmirror.readthedocs.io/"
Repository = "https://github.com/pygitmirror/pygitmirror"
Issues = "https://github.com/pygitmirror/pygitmirror/issues"
Author = "https://girgis.me"


[project.scripts]
git-mirror = "pygitmirror.cli:main"


[dependency-groups]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0", "pytest-xdist>=3.8.0"]
lint = ["mypy>=1.19.1", "ruff>=0.14.0"]
docs = ["sphinx>=8.1.3", "sphinx-autobuild>=2024.10.3", "furo>=2025.9.25"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
]


# The version is the git tag of the release, for example v0.2.0 gives 0.2.0.
[tool.hatch.version]
source = "vcs"


[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
source = ["pygitmirror"]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit: the package handles tokens and runs a subprocess
  "T20", # flake8-print
  "D",   # pydocstyle
]
ignore = [
  "D105", # magic methods need no docstring
  "D107", # constructor parameters are documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
# An overriding method inherits the docstring of the method it overrides.
ignore-decorators = ["pygitmirror._compat.override", "typing.override"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, run git on repositories they made and use made-up tokens.
"tests/**" = ["D", "S"]
"docs/conf.py" = ["D"]
".github/scripts/*.py" = ["T20"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
