<text x="440.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">a bare repository with</text>
<text x="440.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">all branches and tags</text>
<rect x="620" y="40" width="230" height="110" rx="8" fill="#211a33" stroke="#ab7df8" stroke-width="1.5"/>
