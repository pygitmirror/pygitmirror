<text x="30" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9198a1">An operation which fails changes nothing: it stops before the push.</text>
