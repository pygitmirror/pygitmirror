<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 518" width="880" height="518" role="img">
<title>The eleven steps of an operation, from listing the source to archiving it, and which of clone, sync and migrate takes each.</title>
<rect x="0.75" y="0.75" width="878.5" height="516.5" rx="12" fill="#131416" stroke="#30363d" stroke-width="1.5"/>
<text x="610" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">clone</text>
<text x="700" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">sync</text>
<text x="790" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">migrate</text>
<line x1="30" y1="58" x2="850" y2="58" stroke="#545d68" stroke-width="1.5"/>
<circle cx="46" cy="80" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">1</text>
<text x="72" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">List the branches and tags of the source</text>
<circle cx="610" cy="80" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="80" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="80" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="116" r="12" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="46" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d29922">2</text>
<text x="72" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Create the destination repository if it is missing</text>
<circle cx="610" cy="116" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="116" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="116" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="152" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">3</text>
<text x="72" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">List the branches and tags of the destination</text>
<circle cx="610" cy="152" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="152" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="152" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="188" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">4</text>
<text x="72" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Plan, and stop if nothing has to change</text>
<circle cx="610" cy="188" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="188" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="188" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="224" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">5</text>
<text x="72" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Fetch the source into the local mirror</text>
<circle cx="610" cy="224" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="224" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="224" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="260" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">6</text>
<text x="72" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Check that nothing would be overwritten</text>
<circle cx="610" cy="260" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<line x1="693" y1="260" x2="707" y2="260" stroke="#545d68" stroke-width="1.5"/>
<circle cx="790" cy="260" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="296" r="12" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="46" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d29922">7</text>
<text x="72" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Push to the destination</text>
<circle cx="610" cy="296" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="296" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="296" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="332" r="12" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="46" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d29922">8</text>
<text x="72" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Set the default branch</text>
<circle cx="610" cy="332" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="700" cy="332" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="790" cy="332" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="368" r="12" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="46" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d29922">9</text>
<text x="72" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Delete what the source does not have</text>
<line x1="603" y1="368" x2="617" y2="368" stroke="#545d68" stroke-width="1.5"/>
<circle cx="700" cy="368" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<line x1="783" y1="368" x2="797" y2="368" stroke="#545d68" stroke-width="1.5"/>
<circle cx="46" cy="404" r="12" fill="#131416" stroke="#545d68" stroke-width="1.5"/>
<text x="46" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9198a1">10</text>
<text x="72" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Verify that the destination equals the source</text>
<line x1="603" y1="404" x2="617" y2="404" stroke="#545d68" stroke-width="1.5"/>
<line x1="693" y1="404" x2="707" y2="404" stroke="#545d68" stroke-width="1.5"/>
<circle cx="790" cy="404" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="46" cy="440" r="12" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="46" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d29922">11</text>
<text x="72" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#e6edf3">Archive the source, if asked</text>
<line x1="603" y1="440" x2="617" y2="440" stroke="#545d68" stroke-width="1.5"/>
<line x1="693" y1="440" x2="707" y2="440" stroke="#545d68" stroke-width="1.5"/>
<circle cx="790" cy="440" r="7" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/>
<line x1="30" y1="472" x2="850" y2="472" stroke="#545d68" stroke-width="1.5"/>
<circle cx="46" cy="494" r="9" fill="#131416" stroke="#d29922" stroke-width="1.5"/>
<text x="66" y="499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9198a1">changes a host: skipped in a dry run</text>
<text x="850" y="499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#9198a1">clone sets the default branch only when it creates; sync pushes with force</text>
</svg>
