name: Docker

on:
  pull_request:
    branches: [master]
  release:
    types: [published]

# The jobs only read the repository; what the publishing job needs beyond
# that is granted to it below.
permissions:
  contents: read

# A new commit on a pull request replaces the runs of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-check:
    name: Build the image and check that it runs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the image
        run: make docker-build

      - name: Check the image
        run: make docker-check

  # The one test which uses real servers and real tokens: two Gitea servers
  # in containers, and clone, sync and migrate from one to the other.
  copy-between-gitea-servers:
    name: Copy between two Gitea servers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Copy between two Gitea servers
        run: make check-gitea

  publish:
    name: Publish the image to the GitHub registry
    if: github.event_name == 'release'
    needs: [build-and-check, copy-between-gitea-servers]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write # required to push the image

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up QEMU for the other processor architecture
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: make docker-publish
