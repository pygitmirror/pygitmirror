name: Publish

on:
  release:
    types: [published]

# The job only reads the repository; what it needs beyond that is granted
# to it below.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pygitmirror/

    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the distributions
        run: make build

      - name: Check that the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make check-release TAG="$TAG"

      - name: Publish to PyPI
        run: make publish
