name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The jobs only read the repository.
permissions:
  contents: read

# A new commit on a pull request replaces the runs of the previous one, which
# would otherwise wait for runners ahead of it. Runs on master are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-build-docs:
    name: Lint, type check and build the docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the docs show the version, which is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run ruff
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build the documentation
        run: make docs
