version: 2
updates:
  # Versions of the actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The base image of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # Locked development dependencies in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      development:
        patterns: ["*"]
